# ============================================
# Financial Intelligence Platform — Local Dev
# ============================================
# Usage: docker compose up -d

services:
  # --- PostgreSQL 16 with pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finterm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_terminal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis (Cache + Rate Limiting + Celery Broker) ---
  redis:
    image: redis:7-alpine
    container_name: finterm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
